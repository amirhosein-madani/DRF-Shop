
services:
  db:
    image: postgres:15-alpine
    container_name: postgress_db
    restart: always
    env_file:
        - .env
    volumes:
        - postgres_data:/var/lib/postgresql/data
  
  backend:
      build: .
      env_file:
        - .env  
      container_name: backend
      restart: always
      command: python manage.py runserver 0.0.0.0:8000
      volumes:
        - .:/app
      ports:
        - "8000:8000"
      depends_on:
        - db
  
  smtp4dev:
    image: rnwood/smtp4dev:latest
    container_name: smtp4dev
    restart: unless-stopped
    ports:
      - "3000:80"      # Web UI
      - "25:25"        # SMTP Server
    volumes:
      - smtp4dev-data:/app/data   # ذخیره ایمیل‌ها

volumes:
  postgres_data:
  smtp4dev-data: